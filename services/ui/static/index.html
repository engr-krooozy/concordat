<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Concordat — Mission Control</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🤝</text></svg>" />
<style>
  :root {
    --bg: #0c0f16; --panel: #141926; --line: #232a3d; --ink: #e8ecf5; --dim: #8b96ad;
    --accent: #6ea8ff; --ok: #3ecf8e; --warn: #f6c453; --bad: #ff6b6b; --gold: #ffd479;
    --alpha: #6ea8ff; --meridian: #b98bff; --union: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 18px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  .tag { color: var(--dim); font-size: 13px; }
  .wrap { padding: 20px 24px; max-width: 1500px; margin: 0 auto; }
  .banks { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .bank { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; min-height: 190px; }
  .bank h2 { font-size: 14px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .b-alpha .dot { background: var(--alpha); } .b-meridian .dot { background: var(--meridian); }
  .b-union .dot { background: var(--union); }
  .status { font-size: 12px; color: var(--dim); margin-bottom: 10px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px;
    border: 1px solid var(--line); background: #1b2233; color: var(--dim); }
  .pill.live { color: var(--gold); border-color: #4a4020; background: #241f10; }
  .pill.done { color: var(--ok); border-color: #1d4736; background: #10241b; }
  .pill.stop { color: var(--bad); border-color: #4a2020; background: #241010; }
  .metric { font-size: 26px; font-weight: 600; letter-spacing: -.5px; }
  .metric small { font-size: 12px; font-weight: 400; color: var(--dim); display: block; }
  section { margin-top: 22px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
    margin: 0 0 10px; }
  .grid2 { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; }
  @media (max-width: 1000px) { .grid2 { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .feed { max-height: 340px; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; }
  .row { padding: 4px 0; border-bottom: 1px solid #1a2032; display: flex; gap: 10px; }
  .row:last-child { border-bottom: 0; }
  .who { color: var(--accent); min-width: 150px; }
  .what { color: var(--dim); min-width: 190px; }
  .msg { display: flex; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid #1a2032; }
  .dirn { font-size: 11px; color: var(--dim); min-width: 62px; }
  .kind { font-size: 12px; }
  .kind.accept { color: var(--ok); } .kind.counter { color: var(--warn); }
  .kind.reject { color: var(--bad); } .kind.signed { color: var(--gold); }
  .terms { color: var(--dim); font-size: 11px; font-family: ui-monospace, monospace; }
  .finding { border-color: #4a4020; background: linear-gradient(180deg, #241f10, var(--panel)); }
  .finding .metric { color: var(--gold); }
  button { background: var(--gold); color: #241a00; border: 0; border-radius: 7px;
    padding: 9px 16px; font-weight: 600; cursor: pointer; font-size: 13px; }
  button:disabled { background: #2a3145; color: var(--dim); cursor: default; }
  .muted { color: var(--dim); }
  .collapsed { color: #9aa6bd; }
  .note { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--dim); line-height: 1.45; }
  .negsummary { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 10px 12px; margin-bottom: 10px; border-radius: 8px; background: #1b2233;
    border: 1px solid var(--line); font-size: 12.5px; color: var(--dim); }
  .negsummary b { color: var(--ink); font-weight: 600; }
  .negsummary .ctr { color: var(--warn); }
  .negsummary .ok { color: var(--ok); }
  .negsummary .no { color: var(--bad); }
  .negsummary .sep { color: #4a5570; }
  .terms-doc { margin-top: 16px; padding: 12px 14px; border: 1px solid #4a4020;
    border-radius: 8px; background: #1a1608; }
  .terms-h { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
    color: #c9b27a; margin-bottom: 8px; }
  .terms-row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0;
    font-size: 12px; color: var(--dim); }
  .terms-row b { color: #ffe9b0; font-weight: 600; }
  svg text { font-family: ui-sans-serif, sans-serif; }
  /* the reveal: perimeters resolve one at a time, then the trail draws between them */
  @keyframes materialise { from { opacity: 0; transform: translateY(10px) scale(.97); }
                           to   { opacity: 1; transform: none; } }
  @keyframes drawline    { to { stroke-dashoffset: 0; } }
  @keyframes pulsering   { 0% { opacity: 0; transform: scale(.6); }
                           55% { opacity: .9; } 100% { opacity: .45; transform: scale(1); } }
  @keyframes fadein { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(.3); } }
  .efan  { animation: fadein .5s ease-out both; }
  .epop  { animation: pop .35s cubic-bezier(.2,.9,.3,1.4) both; transform-box: fill-box;
           transform-origin: center; }
  .banner { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px;
    border: 1px solid var(--line); background: #1b2233; color: var(--dim); }
  .banner.hot { border-color: #4a4020; background: #241f10; color: var(--gold); }
  .caselist { display: flex; gap: 8px; flex-wrap: wrap; }
  .caselist button { background: #1b2233; color: var(--dim); font-weight: 400;
    border: 1px solid var(--line); font-family: ui-monospace, monospace; font-size: 11px; }
  .caselist button.sel { background: #24304a; color: var(--ink); border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Concordat</h1>
  <span class="tag">rival banks' agent fleets negotiating a joint investigation — no raw data ever crosses a perimeter</span>
</header>

<div class="wrap">
  <section>
    <h3>Cases</h3>
    <div class="caselist" id="caselist"><span class="muted">loading…</span></div>
    <div id="viewing" class="muted" style="margin-top:10px;font-size:13px">select a case</div>
  </section>

  <section class="banks" id="banks"></section>

  <section class="grid2">
    <div class="card">
      <h3>Negotiation</h3>
      <div id="negsummary" class="negsummary"></div>
      <div id="transcript" class="feed"><span class="muted">no case selected</span></div>
    </div>
    <div class="card" id="findingcard">
      <h3>Joint finding</h3>
      <div id="finding"><span class="muted">the room has not reported yet</span></div>
    </div>
  </section>

  <section class="card">
    <h3>Money flow across perimeters</h3>
    <div id="banner" class="banner">select a case</div>
    <svg id="graph" viewBox="0 0 1200 340" width="100%" height="340"></svg>
  </section>

  <section class="card">
    <h3>Audit trail</h3>
    <div id="audit" class="feed"><span class="muted">no case selected</span></div>
  </section>
</div>

<script>
const BANKS = ["alpha", "meridian", "union"];
let selected = null, lastStatus = null, lastGraphSig = null;

const esc = (s) => String(s ?? "").replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
const money = (n) => n == null ? "—" : Number(n).toLocaleString("en-NG", { maximumFractionDigits: 0 });

function pillClass(status) {
  if (["closed"].includes(status)) return "done";
  if (["rejected"].includes(status)) return "stop";
  return "live";
}

async function refreshCases() {
  const cases = await (await fetch("/api/cases")).json();
  const el = document.getElementById("caselist");
  if (!cases.length) { el.innerHTML = '<span class="muted">no cases yet — run <code>make demo</code></span>'; return; }
  if (!selected) { selected = cases[0].case_id; refreshCase(); }  // don't wait for the poll
  el.innerHTML = cases.map(c =>
    `<button class="${c.case_id === selected ? "sel" : ""}" onclick="selectCase('${c.case_id}')">
       ${esc(c.case_id)} · ${esc(c.status)}</button>`).join("");
}

function selectCase(id) { selected = id; lastStatus = null; lastGraphSig = null; refreshCase(); refreshCases(); }

function renderBanks(c) {
  const finding = c.finding || {};
  const hops = Object.fromEntries((finding.hops || []).map(h => [h.bank, h]));
  document.getElementById("banks").innerHTML = BANKS.map(b => {
    const isOwner = c.bank === b;
    const hop = hops[b];
    const status = isOwner ? c.status : (hop ? "contributed" : (c.concordat ? "signed" : "—"));
    const accounts = isOwner ? (c.boundary_edges || []).length : (hop ? hop.accounts : null);
    const label = isOwner ? "accounts at our boundary" : "accounts disclosed (k-thresholded)";
    return `<div class="bank b-${b}">
      <h2><span class="dot"></span>Bank ${b}${isOwner ? " · initiator" : ""}</h2>
      <div class="status"><span class="pill ${pillClass(status)}">${esc(status)}</span></div>
      <div class="metric">${accounts ?? "—"}<small>${label}</small></div>
      ${hop ? `<div class="metric" style="font-size:16px;margin-top:8px">NGN ${money(hop.total_ngn)}<small>value observed at this hop</small></div>` : ""}
      ${isOwner && c.enforcement?.length ? `<div class="metric" style="font-size:16px;margin-top:8px">${c.enforcement.length}<small>actions inside own perimeter</small></div>` : ""}
      <div class="note">${isOwner
        ? "our ledger · our customers · we act only here"
        : (hop ? "answered under the agreed threshold — we never saw a row"
               : "a separate GCP project; unreadable to us")}</div>
    </div>`;
  }).join("");
}

function renderNegSummary(c) {
  const el = document.getElementById("negsummary");
  const t = (c.negotiation_transcript || []).map(x => x.message);
  const opening = t.find(m => m.kind === "investigation_request");
  const counters = t.filter(m => m.kind === "counter_proposal");
  const signed = t.find(m => m.kind === "concordat_signed");
  if (!opening) { el.innerHTML = ""; return; }
  const seen = new Set();
  const parts = [`<b>Alpha asked</b> for k=${opening.k_threshold}`];
  for (const m of counters) {
    if (seen.has(m.bank)) continue;
    seen.add(m.bank);
    parts.push(`<span class="ctr">${esc(m.bank)} countered k=${m.k_threshold}</span>`);
  }
  parts.push(signed ? `<b class="ok">agreed k=${signed.k_threshold}</b>`
                    : (c.status === "rejected" ? `<b class="no">no agreement</b>` : "…"));
  el.innerHTML = parts.join('<span class="sep">→</span>');
}

function renderTranscript(c) {
  const t = c.negotiation_transcript || [];
  if (!t.length) { document.getElementById("transcript").innerHTML = '<span class="muted">no messages yet</span>'; return; }
  document.getElementById("transcript").innerHTML = t.map(x => {
    const m = x.message, k = m.kind;
    let cls = "", terms = "";
    if (k === "policy_verdict") { cls = m.verdict === "accept" ? "accept" : "reject";
      terms = m.verdict + (m.violated_rules?.length ? " · " + m.violated_rules.join(", ") : ""); }
    if (k === "counter_proposal") { cls = "counter"; terms = `k=${m.k_threshold} ttl=${m.ttl_hours}h`; }
    if (k === "investigation_request") terms = `round ${m.round} · k=${m.k_threshold} ttl=${m.ttl_hours}h`;
    if (k === "concordat_signed") { cls = "signed"; terms = `k=${m.k_threshold} · ${(m.parties||[]).join(", ")}`; }
    if (k === "contribution_receipt") terms = `${m.accounts} accounts · ₦${money(m.total_ngn)}${m.cashout_cluster ? " · " + m.cashout_cluster : ""}`;
    if (k === "contribution_request") terms = `probe ${m.probe_hashes}`;
    return `<div class="msg"><span class="dirn">${x.direction === "sent" ? "→ " : "← "}${esc(x.peer)}</span>
      <span class="kind ${cls}">${esc(k)}</span><span class="terms">${esc(terms)}</span></div>`;
  }).join("");
}

function renderFinding(c) {
  const el = document.getElementById("finding");
  const card = document.getElementById("findingcard");
  const f = c.finding;
  if (!f) { card.classList.remove("finding");
    el.innerHTML = `<span class="muted">${c.status === "rejected" ? "negotiation ended without agreement — nothing was shared" : "the room has not reported yet"}</span>`;
    return; }
  card.classList.add("finding");
  const chain = (f.banks_involved || []).join(" → ");
  const t = c.concordat;
  const terms = t ? `<div class="terms-doc">
      <div class="terms-h">the agreement this was computed under</div>
      <div class="terms-row"><span>parties</span><b>${(t.parties || []).join(" · ")}</b></div>
      <div class="terms-row"><span>minimum group size</span><b>k = ${t.k_threshold}</b></div>
      <div class="terms-row"><span>room lifetime</span><b>${t.ttl_hours} hours</b></div>
      <div class="terms-row"><span>identifiers</span><b>${esc(t.identifier_scheme)}</b></div>
      <div class="terms-row"><span>computations</span><b>${(t.computations || []).map(x => esc(x.kind)).join(", ")}</b></div>
    </div>` : "";
  el.innerHTML = `<div class="metric">${f.mule_accounts}<small>mule accounts across ${esc(chain)}</small></div>
    <div class="metric" style="margin-top:10px">NGN ${money(f.total_ngn)}<small>concentrated at ${esc(f.cashout_cluster)}</small></div>
    ${terms}
    <div style="margin-top:14px">${
      c.status === "awaiting_approval"
        ? `<button onclick="approve(this)">Approve enforcement</button>
           <div class="muted" style="margin-top:6px;font-size:12px">agents cannot act until a human clicks</div>`
        : `<span class="muted">${c.status === "closed" ? "approved · enforcement complete" : "awaiting the room"}</span>`}</div>`;
}

function renderGraph(c) {
  const f = c.finding, signed = !!c.concordat;
  const hops = Object.fromEntries((f?.hops || []).map(h => [h.bank, h]));
  const cols = { alpha: "#6ea8ff", meridian: "#b98bff", union: "#3ecf8e" };
  const W = 30;                                   // mules per layer, as planted
  const band = { alpha: [40, 392], meridian: [420, 772], union: [800, 1152] };
  const dotX = { alpha: 300, meridian: 640, union: 980 };
  const wall = [406, 786];
  // a slight waist at the middle bank keeps the crossing lines from reading as a barcode
  const spread = { alpha: 1, meridian: 0.86, union: 1 };
  const yOf = (i, b = "alpha") => 165 + (46 + i * (238 / (W - 1)) - 165) * spread[b];
  const mid = 165;

  const sig = JSON.stringify({ b: c.bank, e: (c.boundary_edges || []).length,
                               f: f || null, s: signed, st: c.status });
  if (sig === lastGraphSig) return;
  const hadFinding = lastGraphSig ? !!JSON.parse(lastGraphSig).f : false;
  const reveal = !!f && !hadFinding;
  lastGraphSig = sig;

  const known = { alpha: true, meridian: !!hops.meridian, union: !!hops.union };
  let g = `<defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffd479"/></marker>
    <filter id="soft"><feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;

  // perimeter bands — a bank we cannot see into stays dim and dashed
  BANKS.forEach(b => {
    const [x0, x1] = band[b], on = known[b];
    g += `<rect x="${x0}" y="18" width="${x1 - x0}" height="292" rx="12"
      fill="${on ? "#131a29" : "#0f1320"}" stroke="${on ? cols[b] : "#242c40"}"
      stroke-width="${on ? 1.6 : 1}" ${on ? "" : 'stroke-dasharray="6 5"'} opacity="${on ? 1 : .6}"/>
      <text x="${(x0 + x1) / 2}" y="40" fill="${on ? cols[b] : "#5b647a"}" font-size="12.5"
        text-anchor="middle" font-weight="600">bank ${b}</text>`;
  });

  // the two institutional walls
  wall.forEach((wx, i) => {
    const crossed = i === 0 ? known.meridian : known.union;
    const k = c.concordat?.k_threshold;
    g += `<rect x="${wx - 7}" y="14" width="14" height="300" rx="3"
        fill="${crossed ? "#2a2312" : "#171d2e"}" opacity=".95"/>
      <line x1="${wx}" y1="14" x2="${wx}" y2="314" stroke="${crossed ? "#ffd479" : "#4d566f"}"
        stroke-width="2" stroke-dasharray="${crossed ? "1 6" : "7 6"}" opacity="${crossed ? .9 : .8}"/>
      <text x="${wx}" y="330" fill="${crossed ? "#ffd479" : "#8b96ad"}" font-size="10.5"
        text-anchor="middle" font-weight="600">${
      crossed ? `crossed under concordat · k=${k ?? "?"}` : "institutional boundary"}</text>`;
  });

  const edge = (x1, y1, x2, y2, stroke, w, op, cls, delay) =>
    `<path class="${cls}" style="animation-delay:${delay}s" d="M${x1},${y1} C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}"
      fill="none" stroke="${stroke}" stroke-width="${w}" opacity="${op}"/>`;

  // victim -> the mule layer inside alpha: one debit fanning out
  for (let i = 0; i < W; i++) {
    g += edge(126, mid, dotX.alpha, yOf(i, "alpha"), "#6ea8ff", 0.7, 0.5,
              reveal ? "efan" : "", reveal ? 0.1 + i * 0.006 : 0);
  }
  // each wall crossing, only once that bank has answered
  [["alpha", "meridian", 0.55], ["meridian", "union", 0.95]].forEach(([a, b, d]) => {
    if (!known[b]) return;
    for (let i = 0; i < W; i++) {
      g += edge(dotX[a], yOf(i, a), dotX[b], yOf(i, b), "#ffd479", 0.85, 0.62,
                reveal ? "efan" : "", reveal ? d + i * 0.006 : 0);
    }
  });
  // and the convergence: thirty accounts, one cash-out point
  if (hops.union) {
    for (let i = 0; i < W; i++) {
      g += edge(dotX.union, yOf(i, "union"), 1108, mid, "#ffd479", 0.85, 0.62,
                reveal ? "efan" : "", reveal ? 1.35 + i * 0.006 : 0);
    }
  }

  // nodes
  g += `<circle cx="126" cy="${mid}" r="9" fill="#6ea8ff" ${reveal ? 'class="epop" style="animation-delay:.05s"' : ""}/>
    <text x="126" y="${mid + 26}" fill="#9dc0ff" font-size="10" text-anchor="middle">victim</text>
    <text x="126" y="${mid - 18}" fill="#e8ecf5" font-size="11" text-anchor="middle">NGN 2.4M</text>`;
  BANKS.forEach((b, bi) => {
    if (!known[b]) {
      const [x0, x1] = band[b];
      g += `<text x="${(x0 + x1) / 2}" y="${mid}" fill="#5b647a" font-size="34"
        text-anchor="middle">?</text>
        <text x="${(x0 + x1) / 2}" y="${mid + 24}" fill="#5b647a" font-size="10.5"
        text-anchor="middle">${signed ? "agreed, not yet answered" : "opaque to us"}</text>`;
      return;
    }
    for (let i = 0; i < W; i++) {
      g += `<circle class="${reveal ? "epop" : ""}" style="animation-delay:${reveal ? 0.15 + bi * 0.4 + i * 0.008 : 0}s"
        cx="${dotX[b]}" cy="${yOf(i, b)}" r="3.4" fill="${cols[b]}"/>`;
    }
    const n = b === c.bank ? (c.boundary_edges || []).length : hops[b]?.accounts;
    const [x0, x1] = band[b];
    const hopNgn = hops[b] ? `NGN ${money(hops[b].total_ngn)}` : "";
    g += `<text x="${(x0 + x1) / 2}" y="288" fill="#e8ecf5" font-size="13"
        text-anchor="middle" font-weight="600">${n ?? "—"} mule accounts</text>
      <text x="${(x0 + x1) / 2}" y="305" fill="#8b96ad" font-size="11"
        text-anchor="middle">${hopNgn}</text>`;
  });
  if (hops.union) {
    g += `<g class="${reveal ? "epop" : ""}" style="animation-delay:1.75s">
      <circle cx="1108" cy="${mid}" r="13" fill="#ffd479" filter="url(#soft)"/>
      <text x="1108" y="${mid - 24}" fill="#ffd479" font-size="11" text-anchor="middle"
        font-weight="600">cash-out</text>
      <text x="1108" y="${mid + 30}" fill="#ffd479" font-size="10" text-anchor="middle">${esc(f.cashout_cluster)}</text></g>`;
  }
  document.getElementById("graph").innerHTML = g;
}

function countUp(el, target, ms, delayMs) {
  if (!el) return;
  el.textContent = "0";
  setTimeout(() => {
    const t0 = performance.now();
    const step = (now) => {
      const k = Math.min(1, (now - t0) / ms);
      el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, delayMs);
}

const NARRATION = {
  detected: "a fraud report has just been filed",
  tracing: "Alpha is following the money through its own ledger",
  dead_end: "the trail leaves Alpha's perimeter — alone, this is where it ends",
  discovering: "Alpha is looking for counterpart fleets to ask",
  negotiating: "the banks are bargaining over what may be computed",
  rejected: "no agreement was reached — nothing was shared",
  agreed: "terms signed by all parties",
  room_active: "an ephemeral clean room has been compiled from the agreement",
  joint_analysis: "each bank is contributing a k-thresholded answer, never rows",
  awaiting_approval: "the fleets are done — a human must decide before anything happens",
  enforcing: "Alpha is acting, inside its own perimeter only",
  closed: "case closed",
};

function renderViewing(c) {
  // Every case runs the same planted ring, so the panels below look identical from one case
  // to the next. Without this line, clicking a chip reads as a dead button.
  const opened = (c.opened_at || "").replace("T", " ").slice(0, 16);
  document.getElementById("viewing").innerHTML =
    `viewing <b style="color:var(--ink)">${esc(c.case_id)}</b> · ${esc(c.status)}` +
    (opened ? ` · opened ${esc(opened)} UTC` : "");
}

function renderBanner(c) {
  const el = document.getElementById("banner");
  el.textContent = NARRATION[c.status] || c.status;
  el.className = "banner" + (["dead_end", "awaiting_approval", "closed"].includes(c.status) ? " hot" : "");
}

function renderAudit(c) {
  // Thirty consecutive "freeze_and_review" lines are one decision, not thirty. Collapsing
  // runs keeps the entries that actually differ — who approved, what was filed — visible.
  const rows = [];
  for (const e of (c.audit || [])) {
    const kind = (e.detail || "").split(":")[0];
    const last = rows[rows.length - 1];
    if (last && last.actor === e.actor && last.action === e.action && last.kind === kind
        && kind && (e.detail || "").includes(":")) {
      last.n += 1; last.lastDetail = e.detail;
    } else {
      rows.push({ actor: e.actor, action: e.action, kind, n: 1,
                  detail: e.detail || "", lastDetail: e.detail || "" });
    }
  }
  document.getElementById("audit").innerHTML = rows.reverse().map(r => {
    const detail = r.n > 1
      ? `${r.kind} × ${r.n}  (${esc(r.detail.split(":")[1] || "")} … ${esc(r.lastDetail.split(":")[1] || "")})`
      : esc(r.detail.slice(0, 110));
    return `<div class="row"><span class="who">${esc(r.actor)}</span>
      <span class="what">${esc(r.action)}</span>
      <span class="${r.n > 1 ? "muted collapsed" : "muted"}">${detail}</span></div>`;
  }).join("");
}

async function refreshCase() {
  if (!selected) return;
  const r = await fetch(`/api/cases/${selected}`);
  if (!r.ok) return;
  const c = await r.json();
  renderBanks(c); renderNegSummary(c); renderTranscript(c); renderFinding(c);
  renderGraph(c); renderAudit(c);
  renderBanner(c); renderViewing(c);
  lastStatus = c.status;
}

async function approve(btn) {
  // btn is passed in: window.event is not reliable, and when it was undefined this threw
  // before the fetch, so the click looked like it did nothing at all.
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "approving…";
  try {
    const r = await fetch(`/api/cases/${selected}/approve`, { method: "POST" });
    if (!r.ok) {
      // A refusal here is usually the staleness guard, and it carries a sentence worth
      // reading — show that, not the status code and a slice of JSON.
      let why = `${r.status}`;
      try { why = (await r.json()).detail || why; } catch { why = `${r.status}`; }
      throw new Error(why);
    }
    setTimeout(refreshCase, 1500);
  } catch (e) {
    // a silent failure here is worse than an ugly one: the whole point of this button is
    // that a human can see their decision take effect.
    btn.disabled = false; btn.textContent = label;
    const el = document.getElementById("banner");
    el.textContent = `approval failed — ${e.message}`;
    el.className = "banner hot";
  }
}

refreshCases(); refreshCase();
setInterval(refreshCases, 6000);
setInterval(refreshCase, 3000);
</script>
