# Build the bank image once in the commons, then deploy it into each bank's OWN project.
# The commons keeps only neutral services: the registry, mission control, and clean rooms.
#
#   gcloud builds submit --config infra/cloudbuild.yaml --project=concordat-hack
#
# Every service carries --min-instances=1. A sovereign peer scaled to zero answers an A2A
# card fetch with a Cloud Run 500 before the container exists; the diplomat now retries
# through that, but a warm fleet is what keeps a live demo honest. Roughly $3-5/day across
# all five services — drop it back to 0 once judging closes.
substitutions:
  _REGION: us-central1
  _REPO: us-central1-docker.pkg.dev/concordat-hack/concordat

steps:
  - id: build-bank
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REPO}/bank:latest", "-f", "services/bank/Dockerfile", "."]

  - id: push-bank
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REPO}/bank:latest"]

  - id: build-ui
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REPO}/ui:latest", "-f", "services/ui/Dockerfile", "."]

  - id: push-ui
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REPO}/ui:latest"]

  # --- each fleet lands in its own project, under its own service account ---
  - id: deploy-alpha
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - bank-alpha
      - --project=concordat-alpha
      - --image=${_REPO}/bank:latest
      - --region=${_REGION}
      - --service-account=sa-bank-alpha@concordat-alpha.iam.gserviceaccount.com
      - --set-env-vars=BANK=alpha,COMMONS_PROJECT=concordat-hack
      - --no-allow-unauthenticated
      - --memory=8Gi
      - --cpu=4
      - --timeout=900
      - --min-instances=1
      - --max-instances=3

  - id: deploy-meridian
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - bank-meridian
      - --project=concordat-meridian
      - --image=${_REPO}/bank:latest
      - --region=${_REGION}
      - --service-account=sa-bank-meridian@concordat-meridian.iam.gserviceaccount.com
      - --set-env-vars=BANK=meridian,COMMONS_PROJECT=concordat-hack
      - --no-allow-unauthenticated
      - --memory=8Gi
      - --cpu=4
      - --timeout=900
      - --min-instances=1
      - --max-instances=3

  - id: deploy-union
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - bank-union
      - --project=concordat-union
      - --image=${_REPO}/bank:latest
      - --region=${_REGION}
      - --service-account=sa-bank-union@concordat-union.iam.gserviceaccount.com
      - --set-env-vars=BANK=union,COMMONS_PROJECT=concordat-hack
      - --no-allow-unauthenticated
      - --memory=8Gi
      - --cpu=4
      - --timeout=900
      - --min-instances=1
      - --max-instances=3

  # --- neutral ground stays in the commons ---
  - id: deploy-registry
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - registry
      - --project=concordat-hack
      - --image=${_REPO}/bank:latest
      - --region=${_REGION}
      - --service-account=sa-registry@concordat-hack.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT=concordat-hack
      - --command=uvicorn
      - --args=services.registry.main:app,--host,0.0.0.0,--port,8080
      - --no-allow-unauthenticated
      - --memory=512Mi
      - --min-instances=1
      - --max-instances=2

  - id: deploy-ui
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - mission-control
      - --project=concordat-hack
      - --image=${_REPO}/ui:latest
      - --region=${_REGION}
      - --service-account=sa-mission-ui@concordat-hack.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT=concordat-hack
      - --allow-unauthenticated
      - --memory=512Mi
      - --min-instances=1
      - --max-instances=3

images:
  - ${_REPO}/bank:latest
  - ${_REPO}/ui:latest

options:
  logging: CLOUD_LOGGING_ONLY
